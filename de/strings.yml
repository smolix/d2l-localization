# ── Notebook downloads (tools/build_notebook_zips.py) ────────────────────────
notebooks.readme: |2
  # {book} – {fw}-Notebooks

  Dieses Paket enthält die ausgeführten {fw}-Notebooks aus dem Buch mit den
  berechneten Ausgaben und den Abbildungen, auf die die Notebooks verweisen.
  Es enthält auch den passenden `d2l`-Quellcode und die festgelegten
  Paketversionen für die Umgebungen.

  Den aktuellen Quellcode finden Sie unter <https://github.com/smolix/d2l-neu>.

  ## CPU-Umgebung einrichten (für den Einstieg empfohlen)

  Installieren Sie [uv](https://docs.astral.sh/uv/getting-started/installation/) und führen Sie folgende Befehle aus:

      uv venv --python 3.12
      uv pip sync pylock.cpu.toml
      uv run --no-sync jupyter lab

  {cpu_note}## Umgebung für eine NVIDIA-GPU einrichten

  Unter Linux/x86-64 mit einem kompatiblen NVIDIA-Treiber verwenden Sie
  anstelle der oben genannten CPU-Lockdatei die GPU-Lockdatei:

      uv pip sync pylock.gpu.toml
      uv run --no-sync jupyter lab

  Jedes Framework hat eine eigene GPU-Lockdatei. Prüfen Sie vor der
  Verwendung, ob `nvidia-smi` funktioniert. So importieren die Notebooks
  beispielsweise das Backend:

      from d2l import {mod} as d2l

  Die Ausgaben der Notebooks können Sie offline lesen. Wenn ein Notebook
  Datensätze oder vortrainierte Modelle verwendet, lädt es diese bei der
  ersten Ausführung herunter. Dafür brauchen Sie eine Internetverbindung
  und zusätzlichen Speicherplatz.
notebooks.cpu_note_pytorch: |2+
  Die Kapitel zu Sprachmodellen (`chapter_lm-*`) benötigen neben PyTorch
  auch Transformers und den OpenAI-Client. Verwenden Sie dafür
  `pylock.lm-cpu.toml` (oder `pylock.lm-gpu.toml`) in einer eigenen virtuellen
  Umgebung, etwa mit `uv venv --python 3.12 .venv-lm` und anschließend
  `VIRTUAL_ENV=.venv-lm uv pip sync pylock.lm-cpu.toml`.


notebooks.cpu_note_mxnet: |2+
  Verwenden Sie auf Macs mit Apple Silicon `pylock.cpu-macos.toml` anstelle von `pylock.cpu.toml`.




