slides.beamer_readme: |2
  {title} ({sec}), {book}, https://{host}
  Der Beamer-Quelltext dieses Foliensatzes lässt sich mit XeLaTeX aus
  TeX Live 2022 oder neuer übersetzen:

      xelatex {stem}.tex

  Das Paket enthält {stem}.tex (den Foliensatz), d2l-beamer.tex (die
  D2L-Vorlage), sizes.tex (passende Schriftgrößen für jede Folie, damit
  kein Inhalt über den Rand ragt), figures/ und d2l-logo.png.
  Wenn Source Sans 3 und Inconsolata installiert sind, verwendet die Vorlage
  diese Schriften. Beide sind kostenlos über Google Fonts erhältlich.
  Andernfalls verwendet sie Source Sans Pro und Inconsolata (zi4) aus
  TeX Live oder, wenn auch diese fehlen, die Standardschriften.
  Um eine Folie in Ihrem eigenen Beamer-Foliensatz zu verwenden, kopieren
  Sie diese zusammen mit den Zeilen der Präambel, die \input{d2l-beamer}
  enthalten. \dtlstart/\dtlend legen nur die Größe der Folie fest.

