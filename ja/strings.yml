# ── Notebook downloads (tools/build_notebook_zips.py) ────────────────────────
notebooks.readme: |2
  # {book} — {fw} ノートブック

  本アーカイブには、本書の実行済み {fw} ノートブックが収録されている。計算済みの出力や
  ノートブックから参照される図に加え、対応する `d2l` ライブラリのソースコードとバージョン固定済みの
  環境設定も含まれている。

  最新のソースコードは <https://github.com/smolix/d2l-neu> で公開されている。

  ## CPU 環境のセットアップ（最初に推奨）

  [uv](https://docs.astral.sh/uv/getting-started/installation/) をインストールし、以下を実行する：

      uv venv --python 3.12
      uv pip sync pylock.cpu.toml
      uv run --no-sync jupyter lab

  {cpu_note}## NVIDIA GPU 環境のセットアップ

  互換性のある NVIDIA ドライバを備えた Linux/x86-64 環境では、上記の CPU ロックファイルの代わりに以下を使用する：

      uv pip sync pylock.gpu.toml
      uv run --no-sync jupyter lab

  GPU ロックファイルはフレームワークごとに異なる。使用前に `nvidia-smi` が動作することを確認すること。
  各ノートブックでは、たとえば次のようにバックエンドをインポートする：

      from d2l import {mod} as d2l

  ノートブックの出力はオフラインでも閲覧できる。データセットや事前学習済みモデルを使用するノートブックを
  実行すると、初回実行時にそれらのアセットがダウンロードされるため、インターネット接続と追加のディスク容量が
  必要になる。
notebooks.cpu_note_pytorch: |2+
  「言語モデル」パート（`chapter_lm-*`）では、PyTorch に加えて Transformers と OpenAI クライアントが
  必要になる。これらには別の仮想環境（例：`uv venv --python 3.12 .venv-lm` を作成し、
  `VIRTUAL_ENV=.venv-lm uv pip sync pylock.lm-cpu.toml` を実行）で `pylock.lm-cpu.toml`
  （または `pylock.lm-gpu.toml`）を使用すること。



notebooks.cpu_note_mxnet: |2+
  Apple Silicon 搭載の Mac では、`pylock.cpu.toml` の代わりに `pylock.cpu-macos.toml` を使用すること。

