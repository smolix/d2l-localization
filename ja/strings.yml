  {title} ({sec}), {book}, https://{host}
  スライドデッキの Beamer ソース。XeLaTeX（TeX Live 2022 以降）でビルド可能：

      xelatex {stem}.tex

  収録ファイル：{stem}.tex（スライド本体）、d2l-beamer.tex（D2L テーマ）、sizes.tex
  （フレームのはみ出しを防ぐフレーム別フォントサイズ設定）、figures/、d2l-logo.png。
  フォント：Source Sans 3 と Inconsolata がインストールされていればそれを使用し（Google Fonts
  から無料で入手可能）、なければ TeX Live の Source Sans Pro と Inconsolata (zi4)、それも
  なければ既定フォントを使用する。
  自身の Beamer スライドでフレームを再利用する場合は、プリアンブルの \input{d2l-beamer} の行と
  あわせてコピーすること（\dtlstart/\dtlend はサイズ調整のみを行う）。

